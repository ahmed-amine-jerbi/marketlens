[project]
name = "marketlens-forecaster"
version = "0.1.0"
description = "Stateless forecasting service for Marketlens: price ranges and backtests from a series it is given."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pandas>=2.3",
    "statsforecast>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pandas-stubs>=2.3,<3",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["forecaster", "tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
