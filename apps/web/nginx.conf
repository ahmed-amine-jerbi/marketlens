# Serves the web app and puts the API behind the same origin, so the app needs no CORS and
# (from M5) its sign-in cookie stays first-party.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Scripts, styles and the API's JSON shrink to a quarter or less. API responses carry no secrets
  # next to visitor input, so compressing them doesn't open a BREACH-style leak. Revisit when
  # sign-in (M5) puts tokens in responses: compress those routes only if no input is echoed.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json application/problem+json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Inline styles come from the chart library. Images may come from any https host: news pictures
  # are on each publisher's own site (D27); the API keeps only https image links, and pages load
  # them lazily without a referrer.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    # The API trusts these only from the Compose network (D35); nginx overwrites what the client sent.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  # Built files have content hashes in their names, so they can be cached for a year.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Client-side routes all serve the app shell, which must never be cached stale.
  # add_header here replaces the server-level headers, so each one the page needs is repeated.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
