# Local stack. `docker compose up --build` needs no .env: every value has a local default.
# The web app is at http://localhost:8080; ports bind to 127.0.0.1 only.
name: marketlens

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-marketlens}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches confirmation and password-reset emails locally; web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: services/api
    environment:
      DATABASE_URL: Host=postgres;Port=5432;Database=${POSTGRES_DB:-marketlens};Username=${POSTGRES_USER:-marketlens};Password=${POSTGRES_PASSWORD:-change-me-local-only}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Only nginx, on this network, may set the client IP (D35).
      ForwardedHeaders__KnownNetworks__0: 172.28.0.0/16
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
      BINANCE_MARKET_DATA_BASE_URL: ${BINANCE_MARKET_DATA_BASE_URL:-https://data-api.binance.vision}
      BINANCE_STREAM_BASE_URL: ${BINANCE_STREAM_BASE_URL:-wss://data-stream.binance.vision}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
