version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      lint-tooling:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "globals"]

  - package-ecosystem: nuget
    directory: /services/api
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /services/forecaster
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
