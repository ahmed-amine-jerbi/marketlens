name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: API contract lints clean
        run: npm run lint:api
      - name: Generated API types match the committed contract
        run: |
          npm run generate:api
          git diff --exit-code packages/shared/src/api/schema.ts
      - name: Generated token CSS matches tokens.ts
        run: |
          npm run generate:tokens
          git diff --exit-code packages/shared/src/tokens.css

  api:
    name: API (.NET format, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: services/api/global.json
      - run: dotnet format --verify-no-changes
      - run: dotnet build --configuration Release
      # Includes OpenApiContractTests: the committed services/api/openapi/v1.json must match the API.
      - run: dotnet test --configuration Release --no-build

  forecaster:
    name: Forecaster (Ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/forecaster
    steps:
      - uses: actions/checkout@v7
      # Third-party actions are pinned to a commit SHA; Dependabot updates them.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: services/forecaster
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
